AWSTemplateFormatVersion: '2010-09-09'

Description: Create an EC2 instance with a Security Group

Resources:

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH, HTTP and ICMP traffic
      SecurityGroupIngress:
        # SSH
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

        # HTTP
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

        # ICMP / Ping
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: EC2-Security-Group-UK

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0b6d9d3d33ba97d99
      InstanceType: t3.micro
      KeyName: feyikp
      SecurityGroupIds:
        - !GetAtt EC2SecurityGroup.GroupId

      Tags:
        - Key: Name
          Value: MyCloudFormationEC2-uk