AWSTemplateFormatVersion: '2010-09-09'

Description: Create a simple VPC

Resources:

  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 20.0.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: UKVPC

Outputs:

  VPCId:
    Description: VPC ID
    Value: !Ref MyVPC

  